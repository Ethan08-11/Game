server {
    listen       ${PORT};
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    client_max_body_size 20m;

    # 使用变量 + resolver，避免 upstream 未就绪时 Nginx 启动失败
    resolver ${NGINX_RESOLVER} ipv6=off valid=30s;

    location /api/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # 必须传 upstream 自己的 Host（公网域名时尤其重要）
        proxy_set_header Host ${UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${UPSTREAM_HOST};
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location /ws/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host ${UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${UPSTREAM_HOST};
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }

    location /images/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host ${UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${UPSTREAM_HOST};
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 502 '{"success":false,"code":502,"message":"backend unavailable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
