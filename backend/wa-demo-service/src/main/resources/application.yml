server:
  # Zeabur 注入 PORT；本地可用 SERVER_PORT
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: wa-demo-service

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wa_demo}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 30000
      maximum-pool-size: 10

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Zeabur：RABBITMQ_USERNAME / RABBITMQ_PASSWORD 必须写成字面量，禁止 ${PASSWORD}（会和 MySQL 冲突）
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.zeabur.internal}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:admin}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        missing-queues-fatal: false
        # 认证失败时不拖垮整个 Spring 启动（先让 HTTP 起来）
        possible-authentication-failure-fatal: false
        # 密码未配好前默认不自动拉起 listener；配好后设 RABBITMQ_LISTENER_AUTO_STARTUP=true
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}
        retry:
          enabled: true
          max-attempts: 3

app:
  auth:
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:30d}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:365d}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cc.shturl.wa.demo.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

logging:
  level:
    cc.shturl.wa: info
    com.baomidou.mybatisplus: warn
    org.springframework.amqp: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    rabbit:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
