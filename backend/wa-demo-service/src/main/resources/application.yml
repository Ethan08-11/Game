server:
  address: 0.0.0.0
  # 容器入口会把 SERVER_PORT 指到内网端口；Zeabur 的 PORT 给探针用
  port: ${SERVER_PORT:${PORT:8080}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 200
    max-connections: 10000
    connection-timeout: 20000
  forward-headers-strategy: framework

spring:
  application:
    name: wa-demo-service

  cloud:
    discovery:
      enabled: ${NACOS_DISCOVERY_ENABLED:false}
    service-registry:
      auto-registration:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    loadbalancer:
      cache:
        caffeine:
          spec: initialCapacity=256,expireAfterWrite=60s
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wa_demo}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 30000
      maximum-pool-size: ${MYSQL_POOL_SIZE:30}
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_SIZE:32}
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms

  # Zeabur：RABBITMQ_USERNAME / RABBITMQ_PASSWORD 必须写成字面量，禁止 ${PASSWORD}（会和 MySQL 冲突）
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.zeabur.internal}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:admin}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        missing-queues-fatal: false
        # 认证失败时不拖垮整个 Spring 启动（先让 HTTP 起来）
        possible-authentication-failure-fatal: false
        # 密码未配好前默认不自动拉起 listener；配好后设 RABBITMQ_LISTENER_AUTO_STARTUP=true
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}
        retry:
          enabled: true
          max-attempts: 3

app:
  auth:
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:30d}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:365d}
  match:
    # 本地双窗口联机用 true；Zeabur 生产设 MATCH_ALLOW_SAME_IP=false
    allow-same-ip: ${MATCH_ALLOW_SAME_IP:true}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cc.shturl.wa.demo.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

logging:
  level:
    cc.shturl.wa: info
    com.baomidou.mybatisplus: warn
    org.springframework.amqp: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    rabbit:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
