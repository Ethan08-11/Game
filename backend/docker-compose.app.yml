# 应用 Compose（交付版）
# 只负责后端与前端
# 直接使用已构建镜像，不需要源码参与运行
#
# 使用方式：
#   docker-compose -f docker-compose.app.yml up -d

services:
  backend:
    image: wa-backend:1.1
    container_name: deploy-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_demo}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-wa_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wa_demo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-30m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-7d}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - wa-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

  frontend:
    image: wa-frontend:1.0
    container_name: deploy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - wa-net

networks:
  wa-net:
    external: true

volumes:
  backend_uploads:
  backend_logs:
